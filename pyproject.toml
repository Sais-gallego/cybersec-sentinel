[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersec-sentinel"
version = "1.0.0"
authors = [
  { name="Sergio Andrés Ipuz Saavedra", email="g46113026@gmail.com" },
]
description = "Modern Cybersecurity & Network Defense Toolkit"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]

[project.scripts]
sentinel = "sentinel.cli:main"
